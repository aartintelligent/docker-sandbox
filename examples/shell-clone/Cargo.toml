# ------------------------------------------------------------------------------
# example-shell-clone — a Git repository given to a shell sandbox in clone mode,
# worked on inside, and the work fetched back on the host.
#
# Run it with `just example shell-clone`.
# ------------------------------------------------------------------------------

[package]
name                   = "example-shell-clone"
edition.workspace      = true
license.workspace      = true
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

# Quality gates are centralized in the workspace root `Cargo.toml`.
[lints]
workspace = true

[dependencies]
anyhow         = { workspace = true }
docker-sandbox = { workspace = true }
example-common = { workspace = true }
tokio          = { workspace = true }
