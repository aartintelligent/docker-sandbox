# ------------------------------------------------------------------------------
# example-daemon — what a program reads of the daemon to watch it, and what it
# changes then restores: client options, health, settings, log levels, disk
# usage, network policy, internals, and the resources and VM metrics of a
# sandbox.
#
# Run it with `just example daemon`.
# ------------------------------------------------------------------------------

[package]
name                   = "example-daemon"
edition.workspace      = true
license.workspace      = true
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

# Quality gates are centralized in the workspace root `Cargo.toml`.
[lints]
workspace = true

[dependencies]
anyhow         = { workspace = true }
docker-sandbox = { workspace = true }
example-common = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
