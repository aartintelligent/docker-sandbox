# ------------------------------------------------------------------------------
# example-mcp-client — a minimal MCP client over streamable HTTP, built with
# rmcp: it lists the tools of a server and calls one.
#
# The `mcp-*` examples build it as a static binary for the sandbox and run it
# there against the MCP gateway, the way an agent reaches its servers.
# ------------------------------------------------------------------------------

[package]
name                   = "example-mcp-client"
edition.workspace      = true
license.workspace      = true
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

# Quality gates are centralized in the workspace root `Cargo.toml`.
[lints]
workspace = true

[dependencies]
anyhow     = { workspace = true }
rmcp       = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json = { workspace = true }
tokio      = { workspace = true }
