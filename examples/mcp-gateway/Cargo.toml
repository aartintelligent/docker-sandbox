# ------------------------------------------------------------------------------
# example-mcp-gateway — an MCP server loaded into the gateway of a sandbox,
# checked from inside it with an rmcp client.
#
# Run it with `just example mcp-gateway`. It builds the MCP client it runs in
# the sandbox for the musl target of the sandbox platform, which must be
# installed: `rustup target add x86_64-unknown-linux-musl`.
# ------------------------------------------------------------------------------

[package]
name                   = "example-mcp-gateway"
edition.workspace      = true
license.workspace      = true
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

# Quality gates are centralized in the workspace root `Cargo.toml`.
[lints]
workspace = true

[dependencies]
anyhow         = { workspace = true }
example-common = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
