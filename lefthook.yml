# ------------------------------------------------------------------------------
# lefthook — git hooks, installed once with `just setup` (`lefthook install`).
#
# `pre-commit` runs the fast gates: formatting of Rust and TOML, clippy with
# warnings as errors, and the privacy check of the audit data and of the
# published crate. `commit-msg`
# enforces Conventional Commits through `committed` (rules in committed.toml),
# which `release-plz` relies on. The heavier gates (tests, docs, cargo-deny)
# stay a `just ci` and CI concern so that commits stay fast.
# ------------------------------------------------------------------------------

pre-commit:
  parallel: true
  commands:
    fmt:
      run: cargo fmt --all --check
    taplo:
      run: taplo fmt --check
    clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    privacy:
      glob: "{Cargo.toml,Cargo.lock,audit/snapshots/**,docker-sandbox/tests/fixtures/**,docker-sandbox/src/**,docker-sandbox/*.md,docker-sandbox/Cargo.toml,docker-sandbox/LICENSE-*}"
      run: cargo run --quiet -p audit -- privacy-check

commit-msg:
  commands:
    conventional:
      run: committed --commit-file {1}
