# ------------------------------------------------------------------------------
# Release-plz — releases on every push to `main`, driven by release-plz.toml.
#
# The last stage of the pipeline: a pull request is checked by CI, merged into
# `main`, then collected here. `release-pr` opens or refreshes the release PR
# (version bump and changelog from the Conventional Commits since the last
# release), which CI checks like any other; merging it makes `release` publish
# the version to crates.io, tag it and create its GitHub release. A push
# without a releasable commit (release-plz.toml) changes nothing.
#
# crates.io trusts this workflow (trusted publishing): release-plz trades the
# OIDC identity of the release job for a short-lived token, so no crates.io
# token is stored. A new crate cannot be published that way, so its first
# version, 0.1.0, is published by hand (CONTRIBUTING.md).
#
# `RELEASE_PLZ_TOKEN` is a fine-grained personal token with contents
# and pull-requests write access: events raised with the automatic
# `GITHUB_TOKEN` trigger no other workflow, so a release PR opened with it would
# never receive the `CI OK` check that the protected `main` branch requires.
# The token is a secret of the `release` environment, which only `main` may
# deploy to: a workflow pushed on another branch cannot read it.
# ------------------------------------------------------------------------------

name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Publishes the version to crates.io, then creates its git tag and GitHub
  # release, when a release PR has just been merged. Forks have no release
  # token: they skip it.
  release-plz-release:
    name: Release
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      # The OIDC identity crates.io trusts to publish the crate.
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # rust-toolchain.toml pins the toolchain release-plz runs cargo with.
      - run: rustup toolchain install
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Opens or updates the release PR with version bumps and the changelog;
  # never canceled mid-run so a half-written PR is not left behind.
  release-plz-pr:
    name: Release PR
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # rust-toolchain.toml pins the toolchain release-plz runs cargo with.
      - run: rustup toolchain install
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
