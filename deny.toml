# ------------------------------------------------------------------------------
# cargo-deny — supply-chain policy: advisories, licences, bans, sources.
#
# Run with `cargo deny check` (the `deny` recipe in the justfile); CI runs the
# same command on every push and pull request.
# Reference: https://embarkstudios.github.io/cargo-deny/
# ------------------------------------------------------------------------------

# Resolve the graph with every feature on, so that optional dependencies such
# as those of the `compiler` feature of `docker-sandbox-kit` are checked too.
[graph]
all-features = true

# RustSec advisories: a yanked crate anywhere in the lockfile fails the check.
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked  = "deny"
ignore  = []

[licenses]
version              = 2
confidence-threshold = 0.9
# Permissive licences only. Beyond the usual MIT/Apache-2.0 pair, each entry
# below is there for transitive dependencies (crates that also offer
# Apache-2.0, such as `serial2` or `miniz_oxide`, need nothing more):
# - `Apache-2.0 WITH LLVM-exception`: `rustix`, `linux-raw-sys` and `wasi`.
# - `Unicode-3.0`: `unicode-ident`, behind `syn`.
# - `Unlicense`: `memchr` and `aho-corasick`, behind `regex`.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
]

# The workspace crates are dual-licensed and not subject to this check.
[licenses.private]
ignore = true

# Duplicate versions are reported but tolerated; wildcard version
# requirements are not.
[bans]
multiple-versions          = "warn"
wildcards                  = "deny"
highlight                  = "all"
workspace-default-features = "allow"
external-default-features  = "allow"
deny                       = []
skip                       = []
skip-tree                  = []

# Only crates.io; no git or alternative-registry dependencies.
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
