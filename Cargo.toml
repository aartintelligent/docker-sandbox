# ------------------------------------------------------------------------------
# docker-sandbox — the workspace manifest: its member list, shared package
# metadata, the single source of truth for dependency versions, the lint policy
# every member inherits, and the release build profile.
#
# `docker-sandbox` is the typed client of the `sandboxd` socket of Docker
# Sandboxes, and `docker-sandbox-kit` writes the kit packages it replays, what
# the `sbx` CLI does on the client side. `docker-sandbox-blueprint` describes a
# whole sandbox as data and applies it through the two. `audit` is the tool that maps the
# daemon API and produces the library's test fixtures, a member that is never
# published, as is `docker-sandbox/tests/live-probe`, the program the live tests
# of the library run inside sandboxes. `examples/` is a workspace of its own,
# one crate per example, as in axum.
# ------------------------------------------------------------------------------

[workspace]
members = [
    "audit",
    "docker-sandbox",
    "docker-sandbox-blueprint",
    "docker-sandbox-kit",
    "docker-sandbox/tests/live-probe",
]
# The examples form their own workspace, with their own lockfile.
exclude = ["examples"]
# Pinned explicitly so that the resolver does not change with the edition of a
# future member.
resolver = "3"

# Metadata inherited by every member through `<key>.workspace = true`.
[workspace.package]
authors    = ["Aurelien Andre <aurelien.andre@aartintelligent.fr>"]
categories = ["api-bindings", "asynchronous", "virtualization"]
edition    = "2024"
keywords   = ["docker", "sandbox", "sbx", "sandboxd", "agents"]
license    = "MIT OR Apache-2.0"
# The GitHub repository, linked from the crates.io page.
repository = "https://github.com/aartintelligent/docker-sandbox"
# Keep in sync with rust-toolchain.toml.
# This is the MSRV — 1.88 for `let` chains in `if` conditions, while the
# dependency graph needs 1.85 — which CI checks the workspace on, while
# rust-toolchain.toml pins the newer development toolchain used locally and by
# every other CI job.
rust-version = "1.88"
version      = "0.3.1"

# ------------------------------------------------------------------------------
# Workspace dependencies — every version is declared here exactly once; members
# opt in with `{ workspace = true }` and add only the features they need.
# ------------------------------------------------------------------------------

[workspace.dependencies]
# The library, used by `docker-sandbox-kit` and `audit` through its path;
# release-plz raises the `version` with each release of the crate.
docker-sandbox = { version = "0.3.1", path = "docker-sandbox" }

# The kit packages of the library, forged or compiled, used by `audit` through
# its path. It shares the version of the library, which release-plz raises
# with each release of the two crates.
docker-sandbox-kit = { version = "0.3.1", path = "docker-sandbox-kit" }

# Serialization of the daemon payloads in the library, of the kit bricks of
# `docker-sandbox-kit` and the sandbox specs of `docker-sandbox-blueprint`, and
# of the captures and snapshots of the audit.
serde = { version = "1", features = ["derive"] }

# JSON encoding of the same payloads, and the opaque `serde_json::Value` fields
# kept for forward compatibility with new daemon versions.
serde_json = "1"

# Async runtime. Default features are off: each member enables only what it
# uses (`net` and `io-util` for the socket client, `fs` for kit images, `sync`
# for the creations it reads to their end, `process` and `sync` for the kit
# compiler of `docker-sandbox-kit`, `full` for the audit tool, `rt` and `net`
# for live-probe); the test suites add `rt-multi-thread` and `sync`.
tokio = { version = "1", default-features = false }

# HTTP/1.1 over the `sandboxd` Unix socket in the library, the capture proxy of
# the kit compiler of `docker-sandbox-kit` and the spy of the audit, and the
# HTTP client live-probe runs inside sandboxes. Connection upgrades carry the
# exec, attach and SSH streams.
hyper = "1"

# Tokio adapters for hyper's I/O traits, used wherever hyper is.
hyper-util = { version = "0.1", features = ["tokio"] }

# Request and response types of hyper, used in the error and request types of
# the library.
http = "1"

# Body trait of hyper, implemented by the streaming bodies of the library.
http-body = "1"

# Ready-made bodies (`Full`, `BodyExt`) for the requests hyper sends.
http-body-util = "0.1"

# Byte buffers exchanged with hyper and through the streams.
bytes = "1"

# Wipes secret values from memory when they are dropped: the `Secret` of the
# library and the bodies of the requests that carry credentials. No feature:
# `Zeroizing` and its `AsRef` are in the default set.
zeroize = "1"

# Optional in the library (feature `secrecy`): accepts a `SecretString` as a
# `Secret`, so that programs that already hold one need not expose it to pass
# it on. Its types stay out of the public API, which keeps the library free of
# its breaking changes.
secrecy = "0.10"

# `Stream` for the event and execution streams of the library.
futures-core = "0.3"

# Query string encoding of the daemon routes in the library.
percent-encoding = "2"

# Error enums of the library, of `docker-sandbox-kit` and of
# `docker-sandbox-blueprint`.
thiserror = "2"

# Request logging in the library, and kit compilation logging in
# `docker-sandbox-kit`.
tracing = "0.1"

# Tar archives of the file transfers (`Sandbox::write_file`, `upload_dir`, …),
# and the OCI image layouts `docker-sandbox-kit` reads and writes.
tar = "0.4"

# Command line of the audit; `env` lets options fall back to environment
# variables.
clap = { version = "4", features = ["derive", "env"] }

# Error handling of the audit binary.
anyhow = "1"

# HTTP/1.1 message parsing in the spy proxy of the audit.
httparse = "1"

# Pseudo-terminals for the `sbx exec -it` scenarios of the audit.
portable-pty = "0.9"

# Pattern matching. In the audit: route templating, scrubbing, the router
# inventory scan of the `sbx` binary. In `docker-sandbox-kit`, under its `forge`
# feature: the patterns kit arguments declare for their values, Go-like (RE2)
# regular expressions that the `sbx` CLI checks and the crate now does, and
# their `${{ kit.args.<name> }}` placeholders. Default features: the patterns of
# published kits may use Unicode classes.
regex = "1"

# Rotated daemon logs (`daemon-<time>.log.gz`) read back by the audit.
flate2 = "1"

# SHA-256 digests of the OCI image layouts written for kit sources without the
# `sbx` CLI: by `docker-sandbox-kit` (optional, feature `forge`) and by `audit
# kit-forge`; the default features (`std`) suffice.
sha2 = "0.11"

# Dev-dependency: temporary directories for the socket and kit tests.
tempfile = "3"

# ------------------------------------------------------------------------------
# Quality gates — inherited by every member through `[lints] workspace = true`.
# Never silence one of these locally without a written justification.
# ------------------------------------------------------------------------------

[workspace.lints.rust]
# Every public type should be printable while debugging.
missing_debug_implementations = "warn"
# Every public item must carry English rustdoc.
missing_docs = "warn"
# Edition-2018 idioms (explicit `dyn`, no extern crate, ...); lower priority so
# that individual lints below can still override it.
rust_2018_idioms = { level = "warn", priority = -1 }
# Catches `pub` items that are not actually reachable from outside the crate.
unreachable_pub = "warn"
# No unsafe code anywhere in the workspace.
unsafe_code = "forbid"
# Paths that are already imported should not be spelled out again.
unused_qualifications = "warn"

[workspace.lints.clippy]
# The default lint set plus the pedantic group, both at low priority so that
# the explicit allows and warns below take precedence.
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Names like `api::Sandboxes` are the conventional vocabulary of each module.
module_name_repetitions = "allow"
# Restriction lints worth enforcing in a library.
# Leftover debugging output; the audit binary allows printing, with a reason,
# at its crate root.
dbg_macro    = "warn"
print_stderr = "warn"
print_stdout = "warn"
# Unfinished code must not ship.
todo          = "warn"
unimplemented = "warn"
# Panics on `Option`/`Result` in library code; tests are exempt via clippy.toml.
unwrap_used = "warn"

[workspace.lints.rustdoc]
# A broken `[link]` in rustdoc is a documentation bug, not a warning.
broken_intra_doc_links = "deny"

# ------------------------------------------------------------------------------
# Build profiles — release builds trade compile time for a smaller, faster
# binary; the other profiles keep their defaults.
# ------------------------------------------------------------------------------

[profile.release]
codegen-units = 1
lto           = "fat"
