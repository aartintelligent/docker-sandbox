# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Audit mixin network
description: Test mixin of the docker-sbx audit, allows and denies dummy hosts at run time.
version: "0.1.0"
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - audit-kit-allow.example.com:443
        deny:
          - audit-kit-deny.example.com
