# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Audit mixin network lock
description: Test mixin of the docker-sbx audit, denies every host at run time but one dummy host it allows.
version: "0.1.0"
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - audit-net-allowed.example.invalid
        deny:
          - "**"
