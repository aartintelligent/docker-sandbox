# ------------------------------------------------------------------------------
# Codecov — how the coverage of docker-sandbox is reported.
#
# The `coverage` job of ci.yml uploads the line coverage of the library that
# `cargo llvm-cov` measures, and fails on its own on any line no test runs (and
# below 95 % of the regions, which Codecov does not see): Codecov is the view of
# it — uncovered lines annotated on the pull request diff, a summary comment,
# the history of `main`. Its statuses hold the same bar on lines, for the whole
# library and for the lines a pull request changes.
#
# Pull requests that leave the library untouched upload nothing, so these
# statuses must not be required by branch protection: `CI OK` is.
# ------------------------------------------------------------------------------

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 100%
    patch:
      default:
        target: 100%

comment:
  layout: "condensed_header, diff, files"
