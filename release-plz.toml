# ------------------------------------------------------------------------------
# release-plz — automated release PRs, changelogs, tags and crates.io uploads.
#
# `docker-sandbox` is the one package released: to crates.io, as a git tag and
# a GitHub release, with `docker-sandbox/CHANGELOG.md`. Entries come from
# conventional commits: `feat`, `fix`, `perf`, `doc`, `refactor`, `deprecate`
# and `revert` are grouped under Keep a Changelog headings; `chore`, `ci`,
# `build`, `test` and `style` are skipped. Versions come from crates.io: a
# version not published there yet is the next release.
# Reference: https://release-plz.dev/docs/config
# ------------------------------------------------------------------------------

[workspace]
changelog_update    = false
dependencies_update = false
git_release_enable  = true
git_tag_enable      = true
pr_labels           = ["release"]
# Only the commit types that appear in the changelog open a release.
release_commits = '^(feat|fix|perf|refactor|docs|deprecate|revert)(\(|!|:)'
release_always  = false
# Compares the public API with the last version on crates.io, to raise the
# version a breaking change needs; the first release has nothing to compare.
semver_check = true

# Changelog preamble and the commit-message to section mapping.
[changelog]
header = """# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^doc", group = "Documentation" },
    { message = "^refactor", group = "Changed" },
    { message = "^deprecate", group = "Deprecated" },
    { message = "^(chore|ci|build|test|style)", skip = true },
    { message = "^revert", group = "Reverted" },
    { body = ".*security", group = "Security" },
]

# The library owns the changelog; the commits of the audit tool feed it too,
# since they change what the library is validated against. Its tags are pinned
# to `v<version>`, since the default format depends on how many members
# release-plz counts as public.
# The two published crates share one version (`version_group`), as their
# manifests share the version of the workspace: a release of either is a
# release of both, each with its own tag and changelog.
[[package]]
name              = "docker-sandbox"
changelog_include = ["audit"]
changelog_update  = true
git_tag_name      = "v{{ version }}"
version_group     = "docker-sandbox"

# The kit crate has tags, a changelog and GitHub releases of its own. Its
# first version, 0.3.0, was published by hand, as trusted publishing needs
# (CONTRIBUTING.md); release-plz releases it since.
[[package]]
name             = "docker-sandbox-kit"
changelog_update = true
git_tag_name     = "docker-sandbox-kit-v{{ version }}"
git_release_name = "docker-sandbox-kit v{{ version }}"
version_group    = "docker-sandbox"

# The blueprint crate shares the version too, with tags, a changelog and GitHub
# releases of its own. Trusted publishing cannot publish a new crate: its first
# version is published by hand (CONTRIBUTING.md), and `release = false` keeps
# release-plz away from it until then.
[[package]]
name             = "docker-sandbox-blueprint"
changelog_update = true
git_tag_name     = "docker-sandbox-blueprint-v{{ version }}"
git_release_name = "docker-sandbox-blueprint v{{ version }}"
release          = false
version_group    = "docker-sandbox"

# The audit tool is a member that is never published, versioned or tagged.
# `publish = false` is repeated here: release-plz checks every member's
# manifest against its configuration before it honours `release`.
[[package]]
name    = "audit"
publish = false
release = false

# The program the live tests run inside sandboxes, the same.
[[package]]
name    = "live-probe"
publish = false
release = false
